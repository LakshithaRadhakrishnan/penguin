<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #b3e5fc; font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 40px; padding: 20px; border: 8px solid #0288d1; box-shadow: 0 10px 0 #01579b; }
        input { font-size: 20px; padding: 10px; border-radius: 20px; border: 3px solid #03a9f4; width: 80%; margin: 10px 0; }
        #camera-zone { width: 100%; max-width: 320px; height: 240px; background: #000; margin: 20px auto; border-radius: 20px; overflow: hidden; border: 5px solid #ff9800; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { background: #ff5722; color: white; padding: 15px 40px; border: none; border-radius: 50px; font-size: 25px; cursor: pointer; box-shadow: 0 8px 0 #bf360c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>❄️ Penguin Art Magic! ❄️</h1>
        <p>What is your name?</p>
        <input type="text" id="userName" placeholder="Type your name here..." required>
        
        <div id="camera-zone">
            <video id="video" autoplay playsinline></video>
        </div>

        <p style="font-size: 18px; color: #d32f2f; font-weight: bold; margin-bottom: 10px;">
    ✨ Tap the magic button below to start! ✨
</p>

<button type="button" onclick="takePhoto()" class="btn">
    CLICK & SEE MAGIC! 📸
</button>
        
    </div>

    <script>
        const video = document.getElementById('video');
        
        // Start Camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("Please allow camera access!"));

        function takePhoto() {
            const name = document.getElementById('userName').value;
            if(!name) { alert("Please enter your name first!"); return; }
            // Move to thinking page
            window.location.href = `/show?name=${name}`;
        }
    </script>
</body>
</html>
